[project]
name = "rag-assistant"
version = "0.1.0"
description = "Ask questions about your own documents — local embeddings + Claude, with cited sources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastembed>=0.4",
    "numpy>=1.26",
    "openai>=1.50",
    "pydantic-settings>=2.3",
    "pypdf>=4.0",
    "streamlit>=1.42",
]

[project.scripts]
rag-assistant = "rag_assistant.cli:main"

# Installed by a plain `uv sync` (dependency groups are on by default).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
